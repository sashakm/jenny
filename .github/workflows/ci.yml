name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  check:
    name: Lints, docs and feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run checks
        run: just check

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    # The database tests run against this; without it they would fail rather than skip.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jenny
          POSTGRES_PASSWORD: jenny
          POSTGRES_DB: jenny
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jenny"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JENNY_TEST_POSTGRES_URL: postgres://jenny:jenny@localhost:5432/jenny
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,just
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: just test
      - name: Run the example against Postgres
        run: cargo test -p jenny --features server,persistence --example basic
        env:
          JENNY__PERSISTENCE__POSTGRES__URL: postgres://jenny:jenny@localhost:5432/jenny
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  scaffold:
    name: Scaffolded projects build and pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Default features
        run: just test-cli
      - name: Every optional feature
        run: just test-cli-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.94
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check on the declared rust-version
        run: just msrv

  package:
    name: Crates package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The release job publishes exactly these tarballs, so a crate that cannot be
      # packaged should fail the PR that broke it, not the release.
      - name: Package and verify every crate
        run: just package
