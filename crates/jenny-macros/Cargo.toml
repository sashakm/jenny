[package]
name = "jenny-macros"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Derive macros (Dto, QueryFormat) for the jenny framework"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
darling = { workspace = true }
stringcase = { workspace = true }

[features]
default = []
# Also emit `utoipa::ToSchema` from `#[derive(Dto)]`.
openapi = []

# Everything is feature-gated, so docs.rs would otherwise show next to nothing.
[package.metadata.docs.rs]
all-features = true
