[package]
name = "jenny-macros"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Macros (Dto, QueryFormat, Aggregate, DomainEvent, use_cases) for the jenny framework"

[lib]
proc-macro = true

[dependencies]
# `full` for parsing the impl blocks `#[use_cases]` is put on.
syn = { workspace = true, features = ["full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
darling = { workspace = true }
stringcase = { workspace = true }

[features]
default = []
# Also emit `utoipa::ToSchema` from `#[derive(Dto)]`.
openapi = []

# Everything is feature-gated, so docs.rs would otherwise show next to nothing.
[package.metadata.docs.rs]
all-features = true
