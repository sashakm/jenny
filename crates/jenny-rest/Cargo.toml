[package]
name = "jenny-rest"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The REST driving adapter of the jenny framework, on axum and tower"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
jenny-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# OpenAPI schema generation for the wire types.
utoipa = { workspace = true, optional = true }

[features]
default = []
openapi = ["dep:utoipa"]

[dev-dependencies]
jenny-security = { workspace = true }
tower = { workspace = true, features = ["util"] }

# Everything is feature-gated, so docs.rs would otherwise show next to nothing.
[package.metadata.docs.rs]
all-features = true
