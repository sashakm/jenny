[package]
name = "jenny-persistence"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Postgres/sqlx persistence helpers for the jenny framework"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
jenny-core = { workspace = true }
jenny-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
# `Notify`, so a committed outbox row wakes the relay at once.
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Apache AGE graphs (`Postgres::graph`): openCypher queries through the same pool.
graph = []

[dev-dependencies]
futures = { workspace = true }

[[test]]
name = "graph_test"
required-features = ["graph"]

# The graph module is behind a feature, so docs.rs would otherwise leave it out.
[package.metadata.docs.rs]
all-features = true
