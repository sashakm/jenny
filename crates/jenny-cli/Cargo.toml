[package]
name = "jenny-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Scaffolding for jenny services"
publish = false

# Named `cargo-jenny` so cargo finds it as the `cargo jenny` subcommand.
[[bin]]
name = "cargo-jenny"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
stringcase = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
