[package]
name = "jenny-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Optional telemetry backends
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-prometheus = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
tracing-loki = { workspace = true, optional = true }

[features]
default = []
# Enable OTLP export for traces, logs (→ Logstash/Loki via OTel Collector), and metrics push.
telemetry-otlp = ["dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing"]
# Enable a Prometheus /metrics scrape endpoint (pull-based metrics).
telemetry-prometheus = ["dep:opentelemetry-prometheus", "dep:prometheus"]
# Enable direct Loki log push (without an OTel Collector).
telemetry-loki = ["dep:tracing-loki"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
