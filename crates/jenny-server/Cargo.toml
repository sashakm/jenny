[package]
name = "jenny-server"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The runtime and composition root of jenny services"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
futures = { workspace = true }
jenny-core = { workspace = true }
jenny-rest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "signal"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
url = { workspace = true }

# Optional: the in-process event bus and messaging adapters.
jenny-messaging = { workspace = true, optional = true }
# Optional: a Postgres pool from `persistence.postgres`, prepared before serving.
jenny-persistence = { workspace = true, optional = true }
topmesys = { workspace = true, optional = true }

# Optional telemetry backends
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-prometheus = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
tracing-loki = { workspace = true, optional = true }

# Optional API description
utoipa = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, optional = true }

[features]
default = []
# The in-process event bus, started and stopped by the runtime.
messaging = ["dep:jenny-messaging", "dep:topmesys"]
# A Postgres pool built from `persistence.postgres`: migrated, its document tables
# created and its readiness checked by the runtime.
persistence = ["dep:jenny-persistence"]
# Serve the OpenAPI document at <framework_path>/openapi.json.
openapi = ["dep:utoipa", "jenny-rest/openapi"]
# Serve a browsable Swagger UI, with its assets compiled in.
swagger-ui = ["openapi", "dep:utoipa-swagger-ui"]
# OTLP export for traces, logs (→ Logstash/Loki via OTel Collector), and metrics push.
telemetry-otlp = ["dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing"]
# A Prometheus scrape endpoint at <framework_path>/metrics (pull-based metrics).
telemetry-prometheus = ["dep:opentelemetry-prometheus", "dep:prometheus"]
# Direct Loki log push (without an OTel Collector).
telemetry-loki = ["dep:tracing-loki"]

[dev-dependencies]
base64 = { workspace = true }
http = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
utoipa = { workspace = true }
uuid = { workspace = true }

# Everything is feature-gated, so docs.rs would otherwise show next to nothing.
[package.metadata.docs.rs]
all-features = true
