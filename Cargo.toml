[workspace]
resolver = "3"
members = [
    "crates/jenny",
    "crates/jenny-cli",
    "crates/jenny-core",
    "crates/jenny-macros",
    "crates/jenny-persistence",
    "crates/jenny-security",
    "crates/jenny-messaging",
    "crates/jenny-rest",
    "crates/jenny-server",
]

[workspace.package]
authors = ["Sasha Kleine-Möllhoff <sashakm@bricknet.de>"]
repository = "https://github.com/sashakm/jenny"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
jenny = { path = "crates/jenny" }
jenny-cli = { path = "crates/jenny-cli" }
jenny-core = { path = "crates/jenny-core" }
jenny-macros = { path = "crates/jenny-macros" }
jenny-persistence = { path = "crates/jenny-persistence" }
jenny-security = { path = "crates/jenny-security" }
jenny-messaging = { path = "crates/jenny-messaging" }
jenny-rest = { path = "crates/jenny-rest" }
jenny-server = { path = "crates/jenny-server" }

anyhow = "1"
async-nats = "0.49"
async-trait = "0.1"
arc-swap = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
cron = "0.16"
form_urlencoded = "1"
futures = "0.3"
glob = "0.3"
jsonwebtoken = { version = "10.4", features = ["use_pem", "rust_crypto"] }
lazy_static = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
] }
stringcase = "0.4"
subtle = "2"
thiserror = "2"
topmesys = "0.2"
http = "1"
tokio = { version = "1.52", default-features = false, features = [
    "fs",
    "macros",
    "time",
    "rt",
    "rt-multi-thread",
] }
tokio-util = { version = "0.7", features = ["time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt",
] }
tracing-opentelemetry = "0.33"
tracing-loki = "0.2"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = [
    "grpc-tonic",
    "http-proto",
    "logs",
    "metrics",
    "trace",
] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-prometheus = "0.32"
prometheus = "0.14"
url = { version = "2.5", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1.24", features = ["serde", "v4"] }
reqwest = { version = "0.13", features = ["json"] }
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.23"
env_logger = "0.11"
fake = { version = "5", features = ["serde_json", "derive"] }
serde_test = "1"
tempfile = "3"
