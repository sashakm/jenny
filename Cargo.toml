[workspace]
resolver = "3"
members = [
    "crates/jenny",
    "crates/cargo-jenny",
    "crates/jenny-core",
    "crates/jenny-macros",
    "crates/jenny-persistence",
    "crates/jenny-security",
    "crates/jenny-messaging",
    "crates/jenny-objects",
    "crates/jenny-rest",
    "crates/jenny-server",
]

[workspace.package]
# Every crate ships on this one version: release-plz bumps them together (version_group).
version = "0.1.0"
rust-version = "1.94"
authors = ["Sasha Kleine-Möllhoff <sashakm@bricknet.de>"]
repository = "https://github.com/sashakm/jenny"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
jenny = { path = "crates/jenny", version = "0.1.0" }
jenny-core = { path = "crates/jenny-core", version = "0.1.0" }
jenny-macros = { path = "crates/jenny-macros", version = "0.1.0" }
jenny-persistence = { path = "crates/jenny-persistence", version = "0.1.0" }
jenny-security = { path = "crates/jenny-security", version = "0.1.0" }
jenny-messaging = { path = "crates/jenny-messaging", version = "0.1.0" }
jenny-objects = { path = "crates/jenny-objects", version = "0.1.0" }
jenny-rest = { path = "crates/jenny-rest", version = "0.1.0" }
jenny-server = { path = "crates/jenny-server", version = "0.1.0" }

anyhow = "1"
async-nats = "0.53"
async-trait = "0.1"
arc-swap = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
cedar-policy = "4.15"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
cron = "0.17"
form_urlencoded = "1"
futures = "0.3"
json-patch = { version = "5", default-features = false, features = ["diff"] }
jsonwebtoken = { version = "12", features = ["use_pem", "rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_ignored = "0.1"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
] }
stringcase = "1"
subtle = "2"
thiserror = "2"
topmesys = "0.3.1"
http = "1"
tokio = { version = "1.54", default-features = false, features = [
    "fs",
    "macros",
    "time",
    "rt",
    "rt-multi-thread",
] }
tokio-util = { version = "0.7", features = ["time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt",
] }
tracing-opentelemetry = "0.34"
tracing-loki = "0.2"
object_store = { version = "0.14", default-features = false, features = ["aws", "fs"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = [
    "grpc-tonic",
    "http-proto",
    "logs",
    "metrics",
    "trace",
] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-prometheus = "0.33"
prometheus = "0.14"
url = { version = "2.5", features = ["serde"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
uuid = { version = "1.29", features = ["serde", "v4"] }
reqwest = { version = "0.13", features = ["json"] }
syn = "3"
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.24"
tempfile = "3"
