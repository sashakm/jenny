# Configuration for the `basic` example.
#
# `service_name`, `system`, `server`, `telemetry` and (with their features) `messaging`,
# `persistence` and `objects` are the only sections the jenny runtime interprets. Notes are kept in memory unless
# `persistence.postgres.url` is set — best through JENNY__PERSISTENCE__POSTGRES__URL,
# since it carries the password — or `messaging.nats.url` (JENNY__MESSAGING__NATS__URL;
# `messaging.nats.tls` and `.auth` secure that connection, see ADR-031).
# Attachments are kept in memory unless `objects.url` is set (with the `objects`
# feature): `s3://bucket/prefix` with the standard AWS_* variables, or `file:///dir`.
# Links between notes are kept in memory unless the `graph` feature is on and
# `persistence.postgres.url` is set; that database must then have Apache AGE, or the
# service stops at startup.
# Everything under `applications.<name>` is passed through untouched and read by the
# service itself — see `NotesConfig` in main.rs.
#
# Any value can be overridden by an environment variable
# (JENNY__SERVER__ADDRESS=[::]:9000) or a CLI flag (--address), in that order of
# increasing precedence.
# Who the service is. Defaults to the package name `jenny::service!()` reads; it names
# event topics, NATS buckets and consumers, and the system principal tasks run as.
service_name: basic-example
server:
  address: "[::]:8000"
telemetry:
  log_format: pretty
messaging:
  events:
    headers:
      caller: true   # caller-subject, and caller-actor when delegated
      source: true   # source-service, source-version
  # inbound:         # how event handlers run, and what becomes of a failed message
  #   principal: system
  #   max_deliver: 5
  #   backoff: [1, 5, 30]
  #   dead_letter: NOTES.dead
applications:
  my-notes:
    greeting: "hello from config.yaml"
    # With `messaging` and a NATS, consume archive requests from this JetStream stream,
    # which must exist and capture `notes.requests.>`.
    # requests_stream: NOTES
